<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Coming Soon</title>
  <script>if(localStorage.getItem("mhl-auth")==="1")location.replace("/site.html");</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0d0d;color:#e8e2d6;font-family:'EB Garamond',Georgia,serif}
    form{display:flex;flex-direction:column;gap:1rem;width:min(320px,90vw);text-align:center}
    h1{font-family:'Cinzel',serif;font-weight:400;letter-spacing:.2em;font-size:1rem;color:#b8972a;margin-bottom:.5rem}
    input,button{font:inherit;padding:.7rem 1rem;border:1px solid #2a2520;background:#141414;color:#e8e2d6}
    input:focus{outline:1px solid #b8972a}
    button{cursor:pointer;font-family:'Cinzel',serif;letter-spacing:.15em;font-size:.85rem;color:#b8972a}
    button:hover{border-color:#b8972a}
    .err{color:#a05040;font-size:.9rem;min-height:1.2em}
  </style>
</head>
<body>
  <form id="gate">
    <h1>Coming Soon</h1>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
    <button type="submit">Enter</button>
    <p class="err" id="err"></p>
  </form>
  <script>
    document.getElementById("gate").addEventListener("submit", function (e) {
      e.preventDefault();
      if (document.getElementById("pw").value === "password") {
        localStorage.setItem("mhl-auth", "1");
        location.replace("/site.html");
      } else {
        document.getElementById("err").textContent = "Incorrect password.";
      }
    });
  </script>
</body>
</html>
